<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" role="img" aria-label="AEC Forge Tools">
  <defs>
    <linearGradient id="fg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#20242b"/><stop offset="1" stop-color="#14171b"/>
    </linearGradient>
    <radialGradient id="fg-glow" cx="0.78" cy="0.35" r="0.6">
      <stop offset="0" stop-color="#e8600a" stop-opacity="0.34"/><stop offset="1" stop-color="#e8600a" stop-opacity="0"/>
    </radialGradient>
    <pattern id="fg-grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" fill="none" stroke="#5c6470" stroke-opacity="0.12" stroke-width="1"/>
    </pattern>
    <linearGradient id="fg-molten" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/><stop offset="1" stop-color="#e8600a"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="420" fill="url(#fg-bg)"/>
  <rect width="1200" height="420" fill="url(#fg-grid)"/>
  <rect width="1200" height="420" fill="url(#fg-glow)"/>

  <!-- messy paperwork stack (left) flowing into a clean deliverable (right) -->
  <g transform="translate(150,120)">
    <g fill="none" stroke="#5c6470" stroke-width="3" stroke-linejoin="round" opacity="0.9">
      <rect x="-8" y="30" width="150" height="188" rx="8" transform="rotate(-9 67 124)" fill="#000" fill-opacity="0.18"/>
      <rect x="8" y="16" width="150" height="188" rx="8" transform="rotate(-4 83 110)" fill="#000" fill-opacity="0.20"/>
      <rect x="26" y="4" width="150" height="188" rx="8" fill="#22272f"/>
    </g>
    <g stroke="#7b8492" stroke-width="6" stroke-linecap="round" opacity="0.55">
      <path d="M50 44 H150"/><path d="M50 74 H160"/><path d="M50 104 H130"/><path d="M50 134 H155"/><path d="M50 164 H120"/>
    </g>
    <!-- scribbles = the "tedious" mess -->
    <path d="M60 190 q14 -14 28 0 t28 0 t28 0" fill="none" stroke="#e8600a" stroke-width="4" stroke-linecap="round" opacity="0.8"/>
  </g>

  <!-- molten arrow -->
  <g transform="translate(430,214)">
    <path d="M0 0 H150" stroke="url(#fg-molten)" stroke-width="10" stroke-linecap="round"/>
    <path d="M138 -16 L166 0 L138 16" fill="none" stroke="#ff8a3d" stroke-width="10" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- clean deliverable (right): crisp white doc with a checkmark badge -->
  <g transform="translate(650,96)">
    <rect x="0" y="0" width="210" height="232" rx="14" fill="#f6f5f2"/>
    <rect x="0" y="0" width="210" height="52" rx="14" fill="url(#fg-molten)"/>
    <rect x="0" y="38" width="210" height="16" fill="url(#fg-molten)"/>
    <g stroke="#c9cdd3" stroke-width="7" stroke-linecap="round">
      <path d="M28 92 H182"/><path d="M28 120 H182"/><path d="M28 148 H150"/><path d="M28 176 H182"/>
    </g>
    <circle cx="182" cy="212" r="30" fill="#63c07a"/>
    <path d="M168 212 l10 11 18 -22" fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- small spark marks -->
  <g fill="#ff8a3d">
    <circle cx="612" cy="150" r="5"/><circle cx="636" cy="196" r="3.5"/><circle cx="600" cy="250" r="3"/>
  </g>
</svg>
